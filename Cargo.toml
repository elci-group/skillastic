[package]
name = "skillastic"
version = "0.16.5"
edition = "2024"
description = "Adaptive skill runtime: version-aware skill lifecycle management for AI agents"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = { version = "1", features = ["serde"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
